continuity: >-
  20th Century Studios' (Disney's) Alien franchise begun by Ridley Scott's Alien (1979):
  the four original films, the Prometheus and Covenant prequels, Alien: Romulus, the FX
  series Alien: Earth and official shorts and in-universe promos. The Alien vs. Predator
  films and Predator: Badlands are included only as crossovers; the rest of the Predator
  continuity, recuts, games, comics, novels and fan works are outside this file.
seeded_from_draft: true
annotator: António Romão
annotated_on: 2026-11-10
