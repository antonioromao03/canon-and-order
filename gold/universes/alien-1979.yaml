      (promotional_content), made for a film, so no parent. Split around Prometheus (a
      single release) per the splitting rule: pieces 1–5 in the first row, 6–7 after.
      Piece 5 probably went up with the film, but no source gives its day, and its
      month-only date sorts as 2012-06-01, before the film; it stays in the first row
      so the gold rows match the date rule.

