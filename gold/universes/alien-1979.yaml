notes:
  - "Alien is dated by its limited US opening (1979-05-25); the wide release was 1979-06-22. Flagged date_conflict."
  - "Prometheus and Alien: Covenant are US–UK productions treated as US (20th Century Fox); both opened in the UK a week before the US."
  - "The Alien vs. Predator films and Predator: Badlands are included as crossover works and marked semi-canon; the Predator films themselves are excluded."
  - "Collective names for the Prometheus viral videos, the Covenant short films and the 40th Anniversary Shorts are descriptive."
  - "A Romulus sequel and a new Covenant-world film written by Aaron Guzikowski have been reported in development with no title or date, so they aren't in upcoming."
  - "The Alien: Romulus home release has only featurettes and deleted scenes; no narrative extras were found."
