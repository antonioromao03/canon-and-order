      - url: https://themoviedb.org/movie/348-alien/releases
        accessed: 2026-11-10
        supports: [existence]
    notes: >-
      UK–US production (Brandywine with 20th Century-Fox, made by Fox's British
      subsidiary); treated as US because Fox is a US studio and the US opening came first
      (UK release 1979-09-06). Dated by the first public engagement, a limited opening in
      90 theaters on 1979-05-25, the day after the Seattle festival premiere. The wide US
      release was 1979-06-22; flagged date_conflict because which date counts depends on
      whether a limited first run qualifies.

