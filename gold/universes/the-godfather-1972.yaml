continuity: >-
  Paramount's Godfather film trilogy directed by Francis Ford Coppola from Mario
  Puzo's novel: The Godfather (1972), Part II (1974) and Part III (1990). Re-edited
  versions (The Godfather Saga, the Epic and Trilogy cuts, The Godfather Coda),
  dramatizations of the films' making, novels and games are outside this file.
