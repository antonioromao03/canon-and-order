exclusions:
  - {title: "Mario Puzo's The Godfather Saga (1977)", reason: "NBC miniseries re-editing the first two films chronologically with restored footage; a recut, not a new work"}
  - {title: "The Godfather 1902–1959: The Complete Epic (1981)", reason: Home-video chronological re-edit of the first two films; a recut}
  - {title: "The Godfather Trilogy: 1901–1980 (1992)", reason: Home-video chronological re-edit of all three films; a recut}
  - {title: "The Godfather Coda: The Death of Michael Corleone (2020)", reason: Coppola's re-edit of Part III with a changed opening and ending; a recut of an existing work}
  - {title: "The Godfather Family: A Look Inside (1991)", reason: Documentary; not narrative}
  - {title: The Offer (2022), reason: Paramount+ dramatization of the first film's real-world production; not set in the story's continuity}
  - {title: The Godfather (novel), reason: Mario Puzo's 1969 source novel; not a screen work}
  - {title: The Godfather Returns and The Godfather's Revenge (novels), reason: Authorized sequel novels with no screen adaptation}
  - {title: The Family Corleone (novel), reason: Prequel novel with no screen adaptation}
  - {title: The Godfather and The Godfather II (video games), reason: Games; not screen releases}

