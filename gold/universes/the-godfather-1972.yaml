notes:
  - "Dates for the first two films use their first public New York engagements; the general releases were 1972-03-24 and 1974-12-20. Both are flagged date_conflict."
  - "No official narrative shorts, specials or in-universe promotional content were found; the 1974 NBC broadcast of the first film was a lightly edited airing, not a new work."
  - "Paramount acquired rights in May 2026 to a novel centred on Connie Corleone for a possible new film; it is an early-development report with no announced title or date, so it isn't listed in upcoming."
