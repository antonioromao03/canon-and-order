        snippet: "US release October 22, 2021 in theaters and on HBO Max"
      - url: https://www.thewrap.com/when-is-dune-on-hbo-max/
        accessed: 2026-11-10
        supports: [release]
        snippet: "Streams on HBO Max October 21 at 6 p.m. ET, a day early"
    notes: >-
      The official US release was 2021-10-22 (theaters and HBO Max), but HBO Max made it
      available to all subscribers from 6 p.m. ET on 2021-10-21, the first date the US
      public could watch it; flagged date_conflict because most sources give 22 October.
      The 2021-09-03 Venice premiere and the 2021-09-15 international rollout don't count.
      Treated as a US film (Legendary/Warner Bros.).

