continuity: >-
  Legendary's Dune continuity begun by Denis Villeneuve's Dune (2021): the Villeneuve
  films and the HBO prequel series Dune: Prophecy, which Legendary's producers place in
  the same universe. Earlier adaptations (Lynch's 1984 film, the Sci Fi Channel
  miniseries), documentaries, games and books are outside this file.
