notes:
  - "Dune (2021) is dated 2021-10-21, when HBO Max opened it to subscribers at 6 p.m. ET; the official release date was 2021-10-22. Flagged date_conflict."
  - "Dune: Prophecy is treated as canon on producer statements that it shares the films' universe; it is not semi_canon."
  - "No official narrative shorts, specials, crossovers or in-universe promotional content were found; trailers, featurettes and marketing tie-ins are out."
  - "Dune: Prophecy Season 2 is officially renewed but has no announced premiere date; reports point to late 2026 at the earliest (https://www.hollywoodreporter.com/tv/tv-news/dune-prophecy-season-2-date-cast-1236423903/), so it is upcoming with expected TBA."
