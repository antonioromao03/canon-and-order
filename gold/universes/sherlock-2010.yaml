    flags: [canon_unclear]
    citations:
      - url: https://eurocrime.blogspot.com/2010/08/tv-news-sherlock-s2-dvd.html?m=1
        accessed: 2026-11-10
        supports: [existence, release]
        snippet: "Series one DVD out 30 August 2010, includes unaired 60-minute pilot"
      - url: https://wikiwand.com/en/articles/Sherlock_(TV_series)
        accessed: 2026-11-10
        supports: [existence, canon]
        snippet: "BBC rejected the pilot and had it reshot as 90-minute episodes"
    notes: >-
      The original 55-60 minute pilot (dir. Coky Giedroyc), never broadcast and first released as an
      extra on the Series 1 DVD. It is a separately filmed production of the first story, not a recut,
      so it is kept as a work; it was superseded by the broadcast first episode, hence semi_canon and
      canon_unclear. Main content (a narrative episode, not short/web/promo); released after the Series 1
      run, so an ordinary row in date order.

