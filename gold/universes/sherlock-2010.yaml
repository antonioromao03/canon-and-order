status: verified
split: test
cutoff: 2026-11-30
continuity: >-
  The BBC/Hartswood Films series Sherlock (2010–2017) created by Steven Moffat and Mark Gatiss,
  a contemporary-London Holmes and Watson: its four series, the Victorian-set special and the
  online mini-episode. Other Sherlock Holmes adaptations are separate continuities.
seeded_from_draft: true
annotator: António Romão
annotated_on: 2026-11-10
