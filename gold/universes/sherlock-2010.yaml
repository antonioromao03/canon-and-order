upcoming: []

exclusions:
  - {title: Elementary, reason: Separate CBS modern-day Holmes adaptation; different continuity}
  - {title: Sherlock Holmes (2009 film), reason: Separate Warner Bros. film continuity}
  - {title: Young Sherlock, reason: Separate Prime Video series; different continuity}
  - {title: Unlocking Sherlock, reason: Documentary}
  - {title: Sherlock Uncovered, reason: Documentary disc extra}
  - {title: "Sherlock: The Network", reason: Mobile app; not a screen release}
  - {title: The Science of Deduction and John Watson's blog, reason: Tie-in websites; not screen media}
  - {title: "Sherlock: The Game Is Now", reason: Live immersive experience; not a screen release}
  - {title: "Sherlock on the Buses (Harry & Paul sketch)", reason: Third-party parody sketch with a different cast}

checks:
  - {type: present, rule: semi_canon, work: sherlock-unaired-pilot}
  - {type: before, rule: companion, first: many-happy-returns, then: sherlock-s3, note: "Made for Series 3 but a single piece released before the premiere; ordinary row in date order"}
  - {type: absent, rule: scope_continuity, title: Elementary}
  - {type: absent, rule: scope_continuity, title: Young Sherlock}

notes:
  - Country of origin treated as GB - Hartswood Films for BBC Wales, premiering on BBC One; PBS Masterpiece co-produced and aired later in the US.
  - The unaired pilot is included as semi_canon rather than excluded because it is a separately filmed narrative production released by the rights holder, not a recut; it was superseded by the broadcast first episode.
  - No fifth series has been officially announced by the cutoff; creators have only said it remains possible.
