continuity: >-
  Sony Pictures' Sam Raimi Spider-Man continuity starring Tobey Maguire: the 2002 film,
  its two sequels, the 2003 MTV animated series made as its continuation (semi-canon,
  later contradicted by Spider-Man 2), and the multiverse crossover Spider-Man: No Way
  Home, in which this continuity's Peter Parker appears. The Amazing Spider-Man films,
  the rest of the MCU and the Spider-Verse animated films are separate continuities.
