notes:
  - "Country of origin is the US for every work (AMC and Sony Pictures Television productions; El Camino premiered on Netflix in the US)."
  - "Better Call Saul Season 6 is split into Part 1 and Part 2 as AMC presented it; Breaking Bad Season 5 likewise."
  - "Breaking Bad: Original Minisodes came out in three batches (2009, 2010, 2011), each treated as its own work; dates for the 2010 and 2011 batches are confirmed only to the year."
  - "Training-video piece dates come from listing sites (TheTVDB, TVmaze, Rotten Tomatoes, fandom wiki) that partly disagree; see each work's notes."
  - "Los Pollos Hermanos: Taste the Family has a descriptive name; 'Taste the Family' is the ad's tagline."
  - "Slippin' Jimmy is kept as semi-canon because no official canon ruling was found."
  - "Promos and extras made for a specific season have it as parent even when released outside its run (Chicks 'N' Guns, Los Pollos Hermanos: Taste the Family, American Greed: James McGill); only sets released during a run get companion rows."
  - "No officially announced titles in this continuity were found as of the cutoff."
