continuity: >-
  New Line Cinema / Warner Bros.' Middle-earth film continuity begun by Peter Jackson's
  The Fellowship of the Ring (2001): the Lord of the Rings and Hobbit trilogies and the
  anime prequel The War of the Rohirrim, which Warner Bros. connects to the films. Earlier
  adaptations (Rankin/Bass, Bakshi, Soviet and Finnish versions), Amazon's The Rings of
  Power, fan films, documentaries and games are separate or out of scope.
