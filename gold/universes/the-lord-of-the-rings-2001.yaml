notes:
  - "Input year 2001 picks Peter Jackson's New Line film continuity (The Fellowship of the Ring, 2001), not Ralph Bakshi's 1978 film or Amazon's series."
  - All films are New Zealand–US co-productions or US–Japan productions released by New Line / Warner Bros.; US general release dates are used throughout, and premieres are ignored.
  - "No official narrative shorts, web series or in-universe promotional pieces from the rights holder were found; production diaries, appendices and extended editions are excluded."
  - "The Lord of the Rings: Shadow of the Past (working title) was announced by Warner Bros. in March 2026, with Stephen Colbert co-writing and a story set after The Return of the King (https://www.npr.org/2026/03/25/nx-s1-5760799/stephen-colbert-lord-of-the-rings); no release date."
