      - url: https://en.wikipedia.org/wiki/The_Animatrix
        accessed: 2026-11-10
        supports: [existence, pieces, canon, continuity]
        snippet: "Osiris shown with Dreamcatcher; rest first on June 3, 2003 home video"
    notes: >-
      Nine shorts conceived and overseen by the Wachowskis, set in the films' world;
      treated as canon. Supplementary (short_film). Pieces in release order: 1 The Second
      Renaissance Part I (online 2003-02-04); 2 Program (online; ANN reported it available
      2003-03-06, exact upload day unconfirmed, so month only; TMDB wrongly lists it as a
      DVD-only June 3 title); 3 Final Flight of the Osiris (in US theaters before
      Dreamcatcher, 2003-03-21); 4 A Detective Story (online 2003-04-04); 5 The Second
      Renaissance Part II (online; AWN says May 2003, TMDB and IMDb give 2003-05-06, no
      primary source for the day); 6–9 Kid's Story, World Record, Beyond, Matriculated
      (first released on the US DVD/VHS, 2003-06-03, numbered in the DVD's running order).
      A US–Japan co-production (Japanese studios, Warner Home Video); treated as US because
      Warner Bros. released it and the US release came first. Not made for a TV season, so
      no parent. Split around The Matrix Reloaded (single release) per the splitting rule:
      pieces 1–5 came out before 2003-05-15, pieces 6–9 after.

