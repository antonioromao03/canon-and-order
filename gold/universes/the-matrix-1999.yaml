notes:
  - "The Animatrix is one work (a set of nine shorts) split into two rows around The Matrix Reloaded; four shorts streamed on the official site and one ran in theaters before the June 3, 2003 home-video release of all nine."
  - "Animatrix piece 2 (Program) is dated to the month only: ANN reported it available on 2003-03-06 but the upload day is unconfirmed. Piece 5 (Second Renaissance Part II) uses 2003-05-06 from TMDB/IMDb; AWN's schedule confirms only May. Flagged piece_dates_unconfirmed."
  - "The Matrix (US/Australia) and The Animatrix (US/Japan) are co-productions; both treated as US, where Warner Bros. released them first."
  - "No in-universe promotional content, crossovers or TV series were found; trailers, featurettes and marketing sites are out."
  - "A new Matrix film by Drew Goddard was announced in April 2024 and is still in development with no release date as of the cutoff."
  - "TMDB id given only for The Matrix (movie/603), confirmed on themoviedb.org; others left out."
