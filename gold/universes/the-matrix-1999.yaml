continuity: >-
  Warner Bros.' Matrix continuity begun by the Wachowskis' The Matrix (1999): the four
  live-action films and The Animatrix shorts. Games, comics, documentaries, parodies and
  re-releases are outside this file; no reboot or separate screen continuity exists.
