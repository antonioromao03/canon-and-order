[project]
name = "canon-and-order"
version = "0.1.0"
description = "Release-ordered, cited timelines of every official screen release in a fictional universe, built by an evaluated LLM + rules pipeline."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "António Romão" }]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "rapidfuzz>=3.14",
    "scipy>=1.18",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "ruff>=0.6",
    "scipy-stubs>=1.18",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/canon_and_order"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PT"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
